plugins {
    alias(libs.plugins.android.application)
    id("com.google.gms.google-services")
}

android {
    namespace 'com.gadel.myapplication'
    compileSdk 36

    defaultConfig {
        applicationId "com.gadel.myapplication"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug{
            //entorno de desarrollo local
            buildConfigField("String", "BASE_URL", "\"http://192.168.1.15:8080/api/\"")
        }
        release {
            //entorno de produccion

            buildConfigField("String", "BASE_URL", "\"https://erp.tuempresa.com/api/\"")
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures{
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    implementation 'com.airbnb.android:lottie:5.2.0'

    //dependendia para analitycs firebase
    //implementation 'com.google.firebase:firebase-analytics:21.3.0'
    //libreria para la autenticacion de firebase
    //implementation 'com.google.firebase:firebase-auth:22.1.2'
    //libreria para la base de datos en tiempo real de firebase
    //implementation 'com.google.firebase:firebase-database:20.2.2'

    // Retrofit para peticiones HTTP
    implementation("com.squareup.retrofit2:retrofit:2.9.0")
    // Convertidor Gson para transformar el JSON de Spring Boot a Clases Java
    implementation("com.squareup.retrofit2:converter-gson:2.9.0")


    // LOMBOK: compileOnly significa que no se compilará dentro del APK final (no pesa nada)
    compileOnly("org.projectlombok:lombok:1.18.30")
    // annotationProcessor es el obrero que escribe los getters y setters invisibles
    annotationProcessor("org.projectlombok:lombok:1.18.30")

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    def room_version = "2.6.1"
    implementation("androidx.room:room-runtime:$room_version")
    annotationProcessor("androidx.room:room-compiler:$room_version")

    // para llamadas asíncronas
    implementation("androidx.room:room-guava:$room_version")
}